<!---
1. What is <figure> tag?

👉 <figure> means:
👉 “Group an image (or content) with related information”
👉 It is used to wrap:
image
diagram
code
media

2. First example
<figure>
  <img src="image.jpg">
</figure>

👉 Output:

👉 Image displayed (grouped inside figure)
-->
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="The description content goes here">
        <title> Page title goes here </title>
    </head>
    <body>
        <h1> The main heading goes here</h1>
        <figure>
            <img src="/html/Creatives/505349592_10228971581301296_6127622745468518898_n.jpg" height="300px"; width="300px" >
        </figure>
    </body>
</html>
