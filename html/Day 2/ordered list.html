<!---
1. Why <ol> is used (Purpose first)
👉 <ol> is used to:
👉 “Create a list where order or sequence matters”
👉 Browser automatically adds:
1
2
3
2. Real-world scenarios

👉 You should use <ol> when:

Showing steps
Instructions
Workflow process
Ranking lists
OCR processing stages
nefits

👉 Automatic numbering
👉 Clear sequence
👉 Better readability
👉 Good for tutorials and workflows

4. Drawbacks

👉 Not suitable for random items
👉 Numbers may become unnecessary in simple lists

Structure (very important)
<ol>
  <li>item</li>
  <li>item</li>
</ol>
-->
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="description" content="The description goes here">
    <title> The title goes here</title>
    </head>
    <body>
        <ol>
        <li> The list goes here</li>
        <li> The list goes here too</li>
        </ol>
        <ol>
            <li> Number 1</li>
        </ol>
    </body>
</html>
