<!--
1. What is <figcaption>?
👉 <figcaption> means:
👉 “Add a caption (description) to a figure”
👉 It is used inside <figure>
-->

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="Description" content="Description goes here">
        <title> The page title goes here</title>
    </head>
    <body>
        <figure>
            <img src="/html/Creatives/557008728_10230557602470834_63219887479706354_n (1).jpg" height="250px" width="250px" >
            <figcaption> The image caption goes here </figcaption>
            <img src="/html/Creatives/504069701_10228927579761285_8968485610992698957_n.jpg" height="250px" width="250px" >
            <figcaption> Diti and Gauri </figcaption>
        </figure>
    </body>
</html>
