<!---
1. What is list styling?

👉 List styling means:

👉 “Changing how list bullets or numbering appear”

👉 This is where:

HTML structure
CSS styling

start connecting together.

2. Very important understanding first

👉 HTML creates the list

<ul>
  <li>Apple</li>
</ul>

👉 CSS changes appearance

<style>
ul {
  list-style-type: square;
}
</style>

👉 So:

Technology	Responsibility
HTML	Structure
CSS	Design/Appearance
-->
