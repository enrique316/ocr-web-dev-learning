<!---
1. Why <ul> is used (Purpose first)

👉 <ul> is used to:
👉 “Create a list of items where order does NOT matter”
👉 Example meaning:

features
options
menu items
2. Real-world scenarios

👉 You should use <ul> when:

Showing product features
Navigation menu (Home, About, Contact)
OCR extracted fields list
Bullet points in blogs
-->
<html>
    <head>
<meta charset="UTF-8">
<meta name="description" content="The description goes here">
<title> The page title goes here</title>
    </head>
    <body>
        <li>The content goes here</li>
        <li>The content goes here</li>
        <li>The content goes here</li>
        <li>The content goes here</li>
        <li>The content goes here</li>
    
    <ul>The content doesnt goes here</ul>
    <ul>The content doesnt goes here</ul>
    <ul>The content doesnt goes here</ul>
     
    </body>
</html>
