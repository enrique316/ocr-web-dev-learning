<!--
1. Why nested lists are used (Purpose first)

👉 Nested list means:

👉 “A list inside another list”

👉 Used when items have:

categories
subcategories
hierarchy
2. Real-world scenarios

👉 You should use nested lists when:

Creating website menus
Showing categories and subcategories
Building documentation structure
Displaying OCR extracted grouped fields

👉 OCR example:

<ul>
  <li>Invoice
    <ul>
      <li>Date</li>
      <li>Total</li>
    </ul>
  </li>
</ul>

3. Benefits

👉 Creates hierarchy
👉 Organizes complex data
👉 Easy navigation
👉 Better readability

4. Drawbacks

👉 Can become confusing if too deep
👉 Harder to style without CSS
👉 Too many levels reduce readability
-->
