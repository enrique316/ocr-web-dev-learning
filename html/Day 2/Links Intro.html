<!--
1. What are links?
👉 Links mean:
👉 “Clickable text or elements that take you to another page or location”
👉 Created using <a> tag
Example :- <a href="#">Click Here</a> 
👉 Breakdown:
<a> → anchor tag
href → where to go
Click Here → visible text
-->

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="Description" content="The Description goes here">
    </head>
    <body>
        <h1> The heading goes here</h1>
        <p> <b>the goes here</b> </p>
        <p> <a href="https://pictoblox.ai/">Goru</a> is a good girl</p>
        <p> Lets visit: <a href="https://www.bing.com"> bing.com</bing></bing></a></p>
    </body>
</html>
