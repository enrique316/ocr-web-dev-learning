<!--
1. Why description lists are used (Purpose first)

👉 Description lists are used to:
👉 “Show terms with their descriptions or definitions”
👉 Best for:

glossary
metadata
labels with values
question-answer structure
2. Real-world scenarios

👉 You should use description lists when:
Showing OCR extracted fields
FAQ sections
Product specifications
Definitions and meanings
👉 OCR example:
<dl>
  <dt>Invoice Number</dt>
  <dd>INV-1023</dd>

  <dt>Total</dt>
  <dd>₹5000</dd>
</dl>
3. Benefits

👉 Clear label-value structure
👉 Better semantic meaning
👉 Cleaner than paragraphs
👉 Good accessibility

4. Drawbacks

👉 Not ideal for normal lists
👉 Styling can look plain without CSS
👉 Beginners often confuse it with <ul> and <ol>
-->

<html>
    <head> 
        <meta charset="UTF-8">
         <meta name="Description" content="The description content goes here"> 
    </head>
    <body>

        <dl>
            <dt><ol> <li>What is HTML</li> </ol> </dt>
            <dd> The html is programming language for the web </dd>
            
        </dl>
    </body>
</html>
