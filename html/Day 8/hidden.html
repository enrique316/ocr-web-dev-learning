<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Elements</title>
</head>
<body>
 <section id="setp-1">
    <h3> Enter Payment Details</h3>
    <br>
    <label id="First-name"> Enter First Name</label>
    <input type="text" id="First-name" form="name"> 
    <br><br>
    <label id="Last-name"> Enter First Name</label>
    <input type="text" id="Last-name" form="last"> 
    <br><br>
    <label id="Address"> Address </label>
    <input type="text" id="Address" form="address"> 
    <br><br>
    <button type="button" id="next"> Next</button>
 </section>

 <section id="setp-2">
    <label id="Customer-name"> Type Customer Name </label>
    <input type="number" required max="12" min="12">
    <button type="submit" id="payment-submit"> Submit</button>
 </section>
    
</body>
</html>
