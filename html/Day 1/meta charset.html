<!--
The <meta charset="UTF-8"> tag defines a web page's character encoding, 
ensuring text, symbols, and emojis render correctly by informing the browser 
how to interpret the code. It should be placed early inside the <head> section, 
ideally before the <title> tag, for maximum compatibility and to prevent character display errors.
-->

<html>
    <head>
     <meta charset="UTF-8"> 
    </head> 
    <body>
<p>नमस्ते</p> 
    </body>
</html>
