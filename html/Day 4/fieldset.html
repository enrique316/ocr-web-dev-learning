<!DOCTYPE html>
<html lang="en">
<head>    
<meta charset="utf-8">
    <meta name="Description" content="Goes here">
    <title> Title Goes here</title>
</head> 
<body>
    <h2> Fieldsets in html</h2>
    <form>
        <fieldset>
            <label> Fill the form</label>
            <br> <br>
            <label> Name</label>
            <input type="text" required placeholder="Enter your name">
            <br> <br>
            <label> Last Name</label>
            <input type="text" placeholder="Enter your name">
            <br> <br>
            <label> Age</label>
            <input type="number" required min="18" max="99">
            <br> <br>
            <label> email "{only gmail accepted }"</label>
            <input type="email" id="email" pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$]" required placeholder="Enter your email id">
            <br> <br>
            <button type="submit"> Submit Details</button>
        </fieldset>
    </form>
</body>
</html>
